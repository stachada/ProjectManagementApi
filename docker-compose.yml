services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabaseProvider: ${DATABASE_PROVIDER:-SqlServer}
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    depends_on:
      db-sqlserver:
        condition: service_healthy
        required: false
      db-postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- SQL Server (default) --- run with: docker-compose --profile sqlserver up
  db-sqlserver:
    profiles: [sqlserver]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - db-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SA_PASSWORD}", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- PostgreSQL --- run with: docker-compose --profile postgres up
  db-postgres:
    profiles: [postgres]
    image: postgres:17
    environment:
      POSTGRES_DB: Ordinis
      POSTGRES_USER: ordinis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordinis -d Ordinis"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  db-sqlserver-data:
  db-postgres-data:
